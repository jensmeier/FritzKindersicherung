<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root { color-scheme: light dark; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
button, select { font:inherit; }
button { border:0; border-radius:10px; min-height:40px; padding:8px 11px; cursor:pointer; background:rgba(127,127,127,.18); color:inherit; }
button.primary { background:#1473e6; color:white; }
button.danger { background:#c73535; color:white; }
button.ok { background:#238b57; color:white; }
button.ticket { background:#6a5acd; color:white; }
button:disabled { opacity:.40; cursor:not-allowed; }
#app { width:100%; height:100%; padding:42px 8px 8px; display:flex; flex-direction:column; gap:7px; min-width:0; min-height:0; }
.card { background:rgba(127,127,127,.10); border:1px solid rgba(127,127,127,.22); border-radius:13px; padding:9px; min-width:0; }
.sub { font-size:12px; opacity:.72; }
.badge { font-size:11px; padding:4px 7px; border-radius:999px; background:rgba(127,127,127,.18); white-space:nowrap; }
.badge.warn { background:#b66c00; color:white; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; background:#8b8b8b; }
.dot.on { background:#2aa666; }
.dot.off { background:#d64b4b; }
.dot.err { background:#d89422; }

/* PIN-Ansicht: explizit für kleine 2x2-Kacheln optimiert. */
#locked { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(3px,1.2vh,8px); overflow:hidden; }
.lockIcon { font-size:clamp(23px,8vh,38px); line-height:1; }
.lockTitle { font-size:clamp(15px,4.8vh,19px); font-weight:750; }
.lockSub { font-size:clamp(10px,3vh,12px); opacity:.70; text-align:center; }
.dots { min-height:18px; font-size:clamp(17px,5vh,23px); line-height:1; letter-spacing:6px; }
.keypad { width:min(100%,214px); display:grid; grid-template-columns:repeat(3,minmax(44px,1fr)); gap:clamp(4px,1.6vh,7px); }
.keypad button { min-width:0; width:100%; height:clamp(39px,11vh,47px); min-height:39px; padding:0; font-size:clamp(16px,5vh,19px); }
#lockmsg { min-height:14px; font-size:10px; text-align:center; opacity:.78; }
@media (max-height:350px) {
  #app { padding:40px 6px 6px; }
  #locked { gap:3px; }
  .lockIcon, .lockSub { display:none; }
  .keypad { gap:4px; width:min(100%,214px); }
  .keypad button { height:39px; min-height:39px; }
  #lockmsg { min-height:12px; }
}
@media (max-width:250px) {
  .lockIcon, .lockSub { display:none; }
  .keypad { width:100%; }
}

/* Freigeschaltete Ansicht */
#unlocked { display:none; flex:1; min-width:0; min-height:0; flex-direction:column; gap:7px; }
.top { display:flex; align-items:center; gap:6px; min-height:40px; }
.top .grow { flex:1; min-width:0; }
.top button { min-width:40px; padding:7px 9px; }
#msg { min-height:15px; max-height:32px; overflow:hidden; font-size:11px; opacity:.82; text-align:center; }
.hint { display:none; font-size:10px; text-align:center; opacity:.65; }

/* Kompaktansicht wird bei kleiner Kachel automatisch genutzt. */
#compactView { display:none; flex:1; min-height:0; overflow:auto; }
.compactGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:7px; }
.summaryCard { min-height:116px; display:flex; flex-direction:column; gap:5px; }
.summaryTop { display:flex; align-items:center; gap:6px; }
.summaryName { font-size:15px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.summaryStatus { margin-left:auto; font-size:10px; opacity:.75; white-space:nowrap; }
.summaryRest { font-size:clamp(22px,8vw,32px); font-weight:800; line-height:1.05; }
.summaryLabel { font-size:10px; opacity:.67; }
.summaryMeta { font-size:10px; opacity:.76; line-height:1.3; white-space:normal; }
.summaryActions { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:auto; }
.summaryActions button { min-height:35px; padding:5px; font-size:10px; }
.compactTicketLine { font-size:10px; opacity:.76; }

/* Großansicht innerhalb großer Kachel / maximierter Ansicht. */
#fullView { display:flex; flex:1; min-height:0; flex-direction:column; gap:7px; }
.overview { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:7px; flex:0 0 auto; }
.overviewCard { padding:8px 10px; display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center; }
.overviewCard strong { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.overviewRest { font-size:22px; font-weight:800; }
.overviewSmall { font-size:12px; opacity:.76; }
.ticketPanel { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:7px 9px; }
.ticketPanel strong { margin-right:3px; }
.ticketCode { font-variant-numeric:tabular-nums; letter-spacing:1px; padding:4px 7px; border-radius:7px; background:rgba(127,127,127,.15); font-size:12px; }
.ticketCode.used { opacity:.45; text-decoration:line-through; }
.ticketPanel .note { font-size:12px; opacity:.70; }
.groups { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:7px; }
.groupHead { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
.groupHead strong { flex:1 1 100px; min-width:80px; }
.groupBudget { font-size:13px; padding:5px 8px; border-radius:8px; background:rgba(127,127,127,.12); white-space:nowrap; }
.profileSelect { max-width:230px; min-width:150px; border:1px solid rgba(127,127,127,.28); border-radius:8px; padding:7px 9px; font-size:14px; background:rgba(127,127,127,.10); color:inherit; }
.profileSelect:disabled { opacity:.58; }
.groupProfile { max-width:185px; }
.device { display:grid; grid-template-columns:minmax(155px,1.5fr) minmax(115px,.8fr) minmax(90px,.7fr) auto; align-items:center; gap:8px; padding:7px 0; border-top:1px solid rgba(127,127,127,.15); }
.devname { font-size:16px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.metaLine { display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-top:2px; }
.ipmeta, .timeinfo, .ticketinfo { font-size:12px; opacity:.76; white-space:nowrap; }
.state { font-size:14px; }
.ticketState { font-size:13px; line-height:1.35; }
.actions { display:grid; grid-template-columns:repeat(3,auto); gap:5px; }
.actions button { min-height:40px; padding:7px 10px; font-size:13px; }

@media (max-width:780px) {
  .device { grid-template-columns:minmax(135px,1fr) minmax(105px,.7fr) auto; }
  .ticketState { grid-column:1/3; }
  .actions { grid-column:3; grid-row:1/3; grid-template-columns:1fr; }
}
/* BUILD25: Touch-Scroll-Fallback fuer die GROSSE eingebettete Symcon-Kachel.
   Fully Kiosk scrollt verschachtelte overflow-Bereiche in einem HTML-SDK-IFrame
   je nach WebView nicht zuverlaessig. Darum wird bei grosser Touch-Ansicht der
   komplette freigeschaltete Bereich zum einzigen Scrollcontainer. */
#tileScrollUp, #tileScrollDown { display:none; }
body.touchLarge #unlocked {
  overflow-y:auto !important;
  overflow-x:hidden !important;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  overscroll-behavior-y:contain;
}
body.touchLarge #fullView {
  flex:0 0 auto !important;
  min-height:auto !important;
  overflow:visible !important;
}
body.touchLarge .groups {
  flex:0 0 auto !important;
  min-height:auto !important;
  overflow:visible !important;
}
body.touchLarge #tileScrollUp,
body.touchLarge #tileScrollDown { display:inline-block; }
body.touchLarge .top {
  position:sticky;
  top:0;
  z-index:20;
  padding:4px 0;
  background:rgba(245,245,245,.94);
  backdrop-filter:blur(5px);
}
@media (prefers-color-scheme: dark) {
  body.touchLarge .top { background:rgba(38,40,45,.94); }
}
body.compact #compactView { display:block; }
body.compact #fullView { display:none; }
body.compact .hint { display:block; }
body.compact #msg { display:none; }
body.parentView #app { padding:10px; }
body.parentView .hint { display:none !important; }
#backParentBtn { display:none; }
#popupBtn { display:inline-block; }
body.parentView #backParentBtn { display:inline-block; }
body.compact .top { min-height:32px; justify-content:flex-end; }
body.compact .top .grow { display:none; }
body.compact .top button { min-height:32px; min-width:32px; padding:3px 6px; }
body.compact .badge { font-size:9px; padding:3px 5px; }
@media (max-height:330px) {
  body.compact .hint { display:none; }
  .summaryCard { min-height:102px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="locked">
    <div class="lockIcon">🔒</div>
    <div class="lockTitle">PIN eingeben</div>
    <div class="lockSub">FRITZ!Box-Steuerung geschützt</div>
    <div id="dots" class="dots">••••</div>
    <div class="keypad">
      <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
      <button type="button" id="backspace">⌫</button><button type="button" data-digit="0">0</button><button type="button" id="pinOk" class="primary">OK</button>
    </div>
    <div id="lockmsg"></div>
  </div>

  <div id="unlocked">
    <div class="top">
      <div class="grow"></div>
      <span id="mode" class="badge"></span>
      <button type="button" id="tileScrollUp" title="Nach oben">▲</button>
      <button type="button" id="tileScrollDown" title="Nach unten">▼</button>
      <button type="button" id="refreshBtn" title="Aktualisieren">↻</button>
      <button type="button" id="popupBtn" title="Elternansicht öffnen">↗</button>
      <button type="button" id="lockBtn" title="Sperren">🔒</button>
    </div>
    <div id="msg"></div>
    <div id="compactHint" class="hint">Nach korrekter PIN öffnet sich die große Elternansicht als eigenes Fenster.</div>

    <div id="compactView">
      <div id="compactGroups" class="compactGrid"></div>
    </div>

    <div id="fullView">
      <div id="overview" class="overview"></div>
      <div id="ticketPanel" class="card ticketPanel"></div>
      <div id="groups" class="groups"></div>
    </div>
  </div>
</div>
<script>
let pin='';
let unlocked=false;
let expiresAt=0;
let lockTimer=null;
let lastData=null;
let redirectPending=false;
let parentPopup=null;
let popupWatch=null;
let popupOpeningForPin=false;
let popupEnabled=__FKS_POPUP_ENABLED__;
let popupAutoOpen=__FKS_POPUP_AUTO__;
const clientId=getClientId();
const browserKey=getBrowserKey();

function getClientId(){
  let id=sessionStorage.getItem('fksClientId');
  if(!id){
    if(window.crypto&&crypto.randomUUID) id=crypto.randomUUID();
    else id=Date.now().toString(36)+Math.random().toString(36).slice(2);
    sessionStorage.setItem('fksClientId',id);
  }
  return id;
}
function getBrowserKey(){
  try{
    let key=localStorage.getItem('fksBrowserKey')||'';
    if(!/^[a-f0-9]{32,64}$/i.test(key)){
      if(window.crypto&&crypto.getRandomValues){
        const a=new Uint8Array(20); crypto.getRandomValues(a); key=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
      }else key=(Date.now().toString(16)+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)).replace(/[^a-f0-9]/gi,'').padEnd(40,'0').slice(0,40);
      localStorage.setItem('fksBrowserKey',key.toLowerCase());
    }
    return key.toLowerCase();
  }catch(e){ return ''; }
}
function send(op,extra={}){ requestAction('command',JSON.stringify(Object.assign({op,clientId,browserKey},extra))); }
function digit(d){ if(pin.length<8) pin+=d; paintDots(); }
function clearPin(){ pin=pin.slice(0,-1); paintDots(); }
function paintDots(){ document.getElementById('dots').textContent=pin.length?'•'.repeat(pin.length):'••••'; }
function parseNavUrl(raw){
  if(!raw) return null;
  try{
    const u=new URL(raw,window.location.href);
    const m=(u.hash||'').match(/^#(\d+)/);
    return {
      href:u.toString(), url:u, id:m?Number(m[1]):0,
      parent:u.searchParams.get('fks_parent')==='1',
      parentId:Number(u.searchParams.get('fks_parent_id')||0),
      handoff:(u.searchParams.get('fks_handoff')||'').trim(),
      returnId:Number(u.searchParams.get('fks_return_id')||0)
    };
  }catch(e){ return null; }
}
function navigationContext(){
  const candidates=[];
  try{ candidates.push(window.top.location.href); }catch(e){}
  try{ if(document.referrer) candidates.push(document.referrer); }catch(e){}
  try{ candidates.push(window.location.href); }catch(e){}
  let fallback=null;
  for(const raw of candidates){
    const ctx=parseNavUrl(raw);
    if(!ctx) continue;
    if(!fallback) fallback=ctx;
    if(ctx.parent||ctx.handoff||ctx.parentId||ctx.returnId) return ctx;
    if(ctx.id) fallback=ctx;
  }
  return fallback||{href:'',url:null,id:0,parent:false,parentId:0,handoff:'',returnId:0};
}
function stripFksParams(u){
  ['fks_parent','fks_parent_id','fks_handoff','fks_return_id'].forEach(k=>u.searchParams.delete(k));
  return u;
}
function baseVisualizationUrl(){
  const ctx=navigationContext();
  if(ctx.url) return new URL(ctx.url.toString());
  try{ return new URL(document.referrer||window.location.href); }catch(e){ return null; }
}
function buildVisualizationUrl(id,handoffToken='',returnId=0){
  const u=baseVisualizationUrl();
  if(!u) return '/?fks_parent=1&fks_parent_id='+encodeURIComponent(String(id))+'&fks_handoff='+encodeURIComponent(handoffToken)+'#'+Number(id);
  stripFksParams(u);
  u.searchParams.set('fks_parent','1');
  u.searchParams.set('fks_parent_id',String(Number(id)));
  if(handoffToken) u.searchParams.set('fks_handoff',handoffToken);
  if(returnId>0) u.searchParams.set('fks_return_id',String(Number(returnId)));
  u.hash='#'+Number(id);
  return u.toString();
}
function buildReturnUrl(returnId){
  const u=baseVisualizationUrl();
  if(!u) return returnId>0?'/#'+Number(returnId):'/';
  stripFksParams(u);
  if(returnId>0) u.hash='#'+Number(returnId);
  else u.hash='';
  return u.toString();
}
function rememberReturnUrl(){
  try{
    let url='';
    try{ url=window.top.location.href||''; }catch(e){}
    if(!url) url=navigationContext().href||'';
    if(url){
      const parentId=Number((lastData&&lastData.parentVisualizationId)||0);
      const ctx=parseNavUrl(url);
      if(!(ctx&&parentId>0&&ctx.id===parentId)) localStorage.setItem('fksReturnUrl',url);
    }
  }catch(e){}
}
function storedReturnUrl(){
  try{
    const raw=localStorage.getItem('fksReturnUrl')||'';
    if(!raw) return '';
    const u=new URL(raw,window.location.href);
    stripFksParams(u);
    return u.toString();
  }catch(e){ return ''; }
}
function clearStoredReturnUrl(){ try{ localStorage.removeItem('fksReturnUrl'); }catch(e){} }

function navigateTop(url){
  try{
    // Fully Kiosk JavaScript Interface, falls in den Advanced Web Settings aktiviert.
    if(window.fully){
      if(typeof window.fully.loadUrl==='function'){ window.fully.loadUrl(url); return true; }
      if(typeof window.fully.loadURL==='function'){ window.fully.loadURL(url); return true; }
    }
  }catch(e){}
  try{ window.top.location.assign(url); return true; }catch(e){}
  try{ window.open(url,'_top'); return true; }catch(e){}
  return false;
}
function isParentVisualization(parentId){
  if(!parentId) return false;
  const ctx=navigationContext();
  if(ctx.parent && (!ctx.parentId || ctx.parentId===Number(parentId))) return true;
  return ctx.id===Number(parentId);
}
function maybeOpenParent(data,handoffToken=''){
  const parentId=Number(data&&data.parentVisualizationId||0);
  if(!data||!data.autoOpenParentVisualization||!parentId) return false;
  if(isParentVisualization(parentId)){
    document.body.classList.add('parentView');
    updateLayout();
    return false;
  }
  const ctx=navigationContext();
  const returnId=Number(ctx.id||0);
  rememberReturnUrl();
  redirectPending=true;
  const ok=navigateTop(buildVisualizationUrl(parentId,handoffToken,returnId));
  if(!ok){
    redirectPending=false;
    const h=document.getElementById('compactHint');
    if(h) h.textContent='Elternansicht konnte nicht geöffnet werden. Bitte Fully Kiosk bzw. die Visualisierungs-ID prüfen.';
  }
  return ok;
}
function returnToPreviousVisualization(){
  const stored=storedReturnUrl();
  if(stored){ clearStoredReturnUrl(); return navigateTop(stored); }
  const serverReturnId=Number((lastData&&lastData.returnVisualizationId)||0);
  if(serverReturnId>0) return navigateTop(buildReturnUrl(serverReturnId));
  const ctx=navigationContext();
  if(ctx.returnId>0) return navigateTop(buildReturnUrl(ctx.returnId));
  try{ if(window.history.length>1){ window.top.history.back(); return true; } }catch(e){}
  return navigateTop(buildReturnUrl(0));
}
function lockAndReturn(){
  send('lock');
  unlocked=false;
  if(lockTimer) clearInterval(lockTimer);
  setTimeout(()=>returnToPreviousVisualization(),100);
}
function cleanHandoffFromAddress(){
  try{
    const u=new URL(window.top.location.href);
    if(!u.searchParams.has('fks_handoff')) return;
    u.searchParams.delete('fks_handoff');
    window.top.history.replaceState(null,'',u.toString());
  }catch(e){}
}
function popupFeatures(){
  try{
    const sw=Math.max(900,Math.min((screen.availWidth||1280)-80,1500));
    const sh=Math.max(650,Math.min((screen.availHeight||900)-80,1000));
    const left=Math.max(0,Math.round(((screen.availWidth||sw)-sw)/2));
    const top=Math.max(0,Math.round(((screen.availHeight||sh)-sh)/2));
    return `popup=yes,width=${sw},height=${sh},left=${left},top=${top},resizable=yes,scrollbars=yes`;
  }catch(e){ return 'popup=yes,resizable=yes,scrollbars=yes'; }
}
function writePopupPending(w){
  try{
    w.document.open();
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRITZ!Box Elternansicht</title><style>body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#f4f5f7;color:#202124}.box{max-width:720px;margin:10vh auto;background:white;border-radius:14px;padding:28px;box-shadow:0 2px 14px rgba(0,0,0,.15)}h2{margin-top:0}.spin{display:inline-block;width:18px;height:18px;border:3px solid #ddd;border-top-color:#2376d8;border-radius:50%;animation:r 1s linear infinite;vertical-align:middle;margin-right:10px}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="box"><h2>FRITZ!Box Elternansicht</h2><p><span class="spin"></span>PIN wird geprüft …</p><p>Dieses Fenster wird bei falscher PIN automatisch geschlossen.</p></div></body></html>`);
    w.document.close();
  }catch(e){}
}
function prepareParentPopup(){
  if(!popupEnabled || !popupAutoOpen) return false;
  popupOpeningForPin=true;
  try{
    if(parentPopup && !parentPopup.closed){ parentPopup.focus(); writePopupPending(parentPopup); return true; }
    parentPopup=window.open('about:blank','FritzKindersicherungEltern',popupFeatures());
    if(!parentPopup){
      popupOpeningForPin=false;
      document.getElementById('lockmsg').textContent='Popup blockiert. Im Browser/Fully Kiosk Popups erlauben.';
      return false;
    }
    writePopupPending(parentPopup);
    parentPopup.focus();
    startPopupWatch();
    return true;
  }catch(e){
    parentPopup=null; popupOpeningForPin=false;
    document.getElementById('lockmsg').textContent='Popup konnte nicht geöffnet werden.';
    return false;
  }
}
function startPopupWatch(){
  if(popupWatch) clearInterval(popupWatch);
  popupWatch=setInterval(()=>{
    if(parentPopup && parentPopup.closed){
      parentPopup=null;
      if(unlocked){ send('lock'); setLocked('Elternansicht geschlossen – gesperrt.'); }
      clearInterval(popupWatch); popupWatch=null;
    }
  },800);
}
function closeParentPopup(){
  const w=parentPopup;
  parentPopup=null;
  if(popupWatch){ clearInterval(popupWatch); popupWatch=null; }
  try{ if(w && !w.closed) w.close(); }catch(e){}
}
function popupEsc(v){ return esc(v); }
function popupOptions(profiles,currentId,placeholder){
  let out=`<option value="">${popupEsc(placeholder||'Profil wählen')}</option>`;
  (profiles||[]).forEach(p=>{ out+=`<option value="${popupEsc(p.id)}"${String(p.id)===String(currentId)?' selected':''}>${popupEsc(p.name)}</option>`; });
  return out;
}
function popupActionButton(label,op,payload,cls,disabled,title=''){
  const enc=encodeURIComponent(JSON.stringify(payload||{}));
  return `<button type="button" class="${cls||''}" data-fks-op="${popupEsc(op)}" data-fks-payload="${enc}"${disabled?' disabled':''}${title?` title="${popupEsc(title)}"`:''}>${popupEsc(label)}</button>`;
}
function popupDocumentHtml(data){
  const summaries=buildSummaries(data);
  const profiles=data.profiles||[];
  const by={}; (data.devices||[]).forEach(d=>{ const g=d.group||'Geräte'; (by[g]??=[]).push(d); });
  const groupNames=Object.keys(by);
  const groupTabs=groupNames.map((g,i)=>`<button type="button" class="groupTab" data-group-index="${i}">${popupEsc(g)}</button>`).join('');
  let overview=summaries.map(s=>`<div class="sum"><b>${popupEsc(s.group)}</b><span class="rest">${s.rest===null?'—':popupEsc(fmt(s.rest))}</span><small>${popupEsc(s.profile||'mehrere/kein Profil')} · ${s.activeExtraMax?`Zusatzzeit bis ${fmtExtraMin(s.activeExtraMax)} · `:''}${s.online}/${s.total} aktiv</small></div>`).join('');
  let tickets='';
  (data.issuedTickets||[]).forEach(t=>{ tickets+=`<span class="code${t.status==='marked'?'':' used'}">${popupEsc(t.id)}${t.status==='marked'?'':' · benutzt/ungültig'}</span>`; });

  if(rest===null){
    const timed=valid.filter(d=>Number(d.timeMax)>0);
    if(timed.length===1){ rest=Math.max(0,Number(timed[0].timeMax)-Number(timed[0].timeUsed)); profile=timed[0].profile||''; }
  }
  const activeExtraMax=valid.reduce((n,d)=>Math.max(n,Number(d.ticketValid)||0),0);
  const queuedExtra=valid.reduce((n,d)=>n+(Number(d.ticketsInAdvance)||0),0);
  return {group,devs,online,total:devs.length,rest,profile,activeExtraMax,queuedExtra};
}

function buildSummaries(data){
  const by={};
  (data.devices||[]).forEach(d=>{ const g=d.group||'Geräte'; (by[g]??=[]).push(d); });
  // In der 2x2-Kachel zuerst die Gruppen mit echtem Restzeit-Budget zeigen (z. B. Paul),
  // danach die übrigen Gruppen. So steht die wichtigste Information ohne Scrollen oben.
  return Object.entries(by)
    .map(([g,devs])=>groupSummary(g,devs))
    .sort((a,b)=>{
      const at=a.rest===null?1:0, bt=b.rest===null?1:0;
      if(at!==bt) return at-bt;
      return String(a.group).localeCompare(String(b.group),'de');
    });
}
function renderCompact(data,summaries){
  const root=document.getElementById('compactGroups'); root.innerHTML='';
  summaries.forEach(s=>{
    const c=document.createElement('div'); c.className='card summaryCard';
    const top=document.createElement('div'); top.className='summaryTop';
    top.innerHTML=`<div class="summaryName">${esc(s.group)}</div><div class="summaryStatus"><span class="dot ${s.online?s.online===s.total?'on':'err':'off'}"></span>${s.online}/${s.total}</div>`;
    c.appendChild(top);
    const rest=document.createElement('div'); rest.className='summaryRest'; rest.textContent=s.rest===null?'—':fmt(s.rest); c.appendChild(rest);
    const lbl=document.createElement('div'); lbl.className='summaryLabel'; lbl.textContent=s.rest===null?'kein gemeinsames Zeitbudget erkannt':'Restzeit heute'; c.appendChild(lbl);
    const meta=document.createElement('div'); meta.className='summaryMeta';
    meta.textContent=s.profile?`Profil: ${s.profile}`:'Profile siehe Großansicht'; c.appendChild(meta);
    const tl=document.createElement('div'); tl.className='compactTicketLine';
    const freeCodes=(data.issuedTickets||[]).filter(t=>t.status==='marked').length;
    tl.textContent=`Zusatzzeit: ${s.activeExtraMax?`bis ${fmtExtraMin(s.activeExtraMax)} aktiv`:'keine'} · Ticketcodes: ${freeCodes}`; c.appendChild(tl);
    const a=document.createElement('div'); a.className='summaryActions';
    const b1=document.createElement('button'); b1.className='danger'; b1.textContent='Alle sperren'; b1.disabled=data.readOnly; b1.addEventListener('click',()=>groupAct(s.group,true));
    const b2=document.createElement('button'); b2.className='ok'; b2.textContent='Freigeben'; b2.disabled=data.readOnly; b2.addEventListener('click',()=>groupAct(s.group,false));
    a.appendChild(b1); a.appendChild(b2); c.appendChild(a); root.appendChild(c);
  });
  if(!summaries.length) root.innerHTML='<div class="card sub">Noch keine Geräte konfiguriert.</div>';
}
function renderOverview(summaries){
  const root=document.getElementById('overview'); root.innerHTML='';
  summaries.forEach(s=>{
    const c=document.createElement('div'); c.className='card overviewCard';
    c.innerHTML=`<strong>${esc(s.group)}</strong><div class="overviewRest">${s.rest===null?'—':esc(fmt(s.rest))}</div><div class="overviewSmall">${esc(s.profile||'mehrere/kein Profil')}</div><div class="overviewSmall">${s.activeExtraMax?`Zusatzzeit bis ${fmtExtraMin(s.activeExtraMax)} aktiv`:'keine aktive Zusatzzeit'}</div>`;
    root.appendChild(c);
  });
}
function renderTicketPanel(data){
  const p=document.getElementById('ticketPanel'); p.innerHTML='';
  const title=document.createElement('strong'); title.textContent='Freie Ticketcodes (global, über Symcon)'; p.appendChild(title);
  const codes=(data.issuedTickets||[]);
  if(codes.length){
    codes.forEach(t=>{
      const span=document.createElement('span'); span.className='ticketCode'+(t.status==='marked'?'':' used');
      span.textContent=t.id+(t.status==='marked'?'':' · benutzt/ungültig'); p.appendChild(span);
    });
  }else{
    const note=document.createElement('span'); note.className='note'; note.textContent='Noch kein Ticketcode über Symcon erzeugt.'; p.appendChild(note);
  }
  const b=document.createElement('button'); b.className='ticket'; b.textContent='Neuen 45-min-Ticketcode holen'; b.disabled=data.readOnly; b.title='Markiert einen freien 6-stelligen FRITZ!-Ticketcode'; b.addEventListener('click',markTicket); p.appendChild(b);
  const note=document.createElement('span'); note.className='note'; note.textContent='Codes sind global und werden erst beim Einlösen an fritz.box einem Gerät zugeordnet. Gezeigt werden nur Codes, die Symcon erzeugt hat.'; p.appendChild(note);
}
function renderFull(data,summaries){
  renderOverview(summaries); renderTicketPanel(data);
  const profiles=data.profiles||[];
  const by={}; (data.devices||[]).forEach(d=>{ const g=d.group||'Geräte'; (by[g]??=[]).push(d); });
  const root=document.getElementById('groups'); root.innerHTML='';
  Object.entries(by).forEach(([g,devs])=>{
    const sum=summaries.find(x=>x.group===g)||groupSummary(g,devs);
    const c=document.createElement('div'); c.className='card';
    const h=document.createElement('div'); h.className='groupHead';
    const name=document.createElement('strong'); name.textContent=g; h.appendChild(name);
    const budget=document.createElement('span'); budget.className='groupBudget'; budget.textContent=sum.rest===null?'Basisbudget: —':`Basis-Rest ${fmt(sum.rest)}`; h.appendChild(budget);
    if(profiles.length){ const gps=makeProfileSelect(profiles,'',v=>setGroupProfile(g,v),'Profil für alle …',data.readOnly,'groupProfile'); h.appendChild(gps); }
    const b1=document.createElement('button'); b1.className='danger'; b1.textContent='Alle sperren'; b1.disabled=data.readOnly; b1.addEventListener('click',()=>groupAct(g,true));
    const b2=document.createElement('button'); b2.className='ok'; b2.textContent='Alle freigeben'; b2.disabled=data.readOnly; b2.addEventListener('click',()=>groupAct(g,false));
    h.appendChild(b1); h.appendChild(b2); c.appendChild(h);

    devs.forEach(d=>{
      const row=document.createElement('div'); row.className='device';
      const st=statusFor(d);
      const info=document.createElement('div');
      const dn=document.createElement('div'); dn.className='devname'; dn.textContent=d.name||'Gerät'; info.appendChild(dn);
      const meta=document.createElement('div'); meta.className='metaLine';
      const ip=document.createElement('span'); ip.className='ipmeta'; ip.textContent=d.ip||''; meta.appendChild(ip);
      if(profiles.length){ const ps=makeProfileSelect(profiles,d.profileId||'',v=>setProfile(d.ip,v),d.profile||'Profil wählen',data.readOnly); meta.appendChild(ps); }
      else { const pr=document.createElement('span'); pr.className='ipmeta'; pr.textContent='Profil '+(d.profile||'—'); meta.appendChild(pr); }
      if(Number(d.timeMax)>0 && !d.isTimeShared){ const t=document.createElement('span'); t.className='timeinfo'; t.textContent=`Rest ${fmt(Math.max(0,Number(d.timeMax)-Number(d.timeUsed)))}`; meta.appendChild(t); }
      info.appendChild(meta); row.appendChild(info);

      const state=document.createElement('div'); state.className='state'; state.innerHTML=`<span class="dot ${st.cls}"></span>${esc(st.text)}`; row.appendChild(state);
      const ts=document.createElement('div'); ts.className='ticketState';
      const n=Number(d.ticketsInAdvance)||0, valid=Number(d.ticketValid)||0;
      ts.innerHTML=`<div>Zusatzzeit: <strong>${valid?fmtExtraMin(valid)+' aktiv':'keine'}</strong></div><div class="sub">${n>0?`${n} weiterer 45-min-Block vorgemerkt`:(Number(d.timeMax)>0?(d.isTimeShared?'Basisbudget gemeinsam · Zusatzzeit pro Gerät':'Zusatzzeit pro Gerät'):'kein Zeitplan/Budget')}</div>`; row.appendChild(ts);

      const a=document.createElement('div'); a.className='actions';
      { const add=document.createElement('button'); add.className='ticket'; add.textContent='+45 min'; add.disabled=data.readOnly||Number(d.timeMax)<=0||d.disallow===true; add.title=d.disallow===true?'Gerät ist manuell gesperrt':(Number(d.timeMax)<=0?'Profil hat kein Zeitbudget/keinen Zeitplan':'45 Minuten Zusatzzeit gezielt für dieses Gerät'); add.addEventListener('click',()=>addTicketTime(d.ip,d.name||'Gerät')); a.appendChild(add); }
      const s=document.createElement('button'); s.className='danger'; s.textContent='Sperren'; s.disabled=data.readOnly; s.addEventListener('click',()=>act(d.ip,true));
      const f=document.createElement('button'); f.className='ok'; f.textContent='Freigeben'; f.disabled=data.readOnly; f.addEventListener('click',()=>act(d.ip,false));
      a.appendChild(s); a.appendChild(f); row.appendChild(a); c.appendChild(row);
    });
    root.appendChild(c);
  });
  if(!Object.keys(by).length) root.innerHTML='<div class="card sub">Noch keine Geräte mit IPv4-Adresse konfiguriert.</div>';
}
function render(data){
  if(!unlocked) return;
  lastData=data;
  if(typeof data.enableParentPopup==='boolean') popupEnabled=data.enableParentPopup;
  if(typeof data.autoOpenParentPopup==='boolean') popupAutoOpen=data.autoOpenParentPopup;
  document.getElementById('popupBtn').style.display=popupEnabled?'inline-block':'none';
  const mode=document.getElementById('mode'); mode.textContent=data.readOnly?'TEST · nur lesen':'STEUERUNG AKTIV'; mode.className='badge'+(data.readOnly?' warn':'');
  document.getElementById('msg').textContent=data.message||'';
  const summaries=buildSummaries(data);
  renderCompact(data,summaries);
  renderFull(data,summaries);
}
function handleMessage(data){
  if(typeof data==='string'){ try{data=JSON.parse(data);}catch(e){return;} }
  if(!data||(data.target&&data.target!=='*'&&data.target!==clientId)) return;
  if(data.kind==='auth'){
    if(data.ok){
      setUnlocked(data);
      if(data.payload){ render(data.payload); if(popupEnabled && popupAutoOpen && data.payload.enableParentPopup!==false && data.payload.autoOpenParentPopup!==false) renderParentPopup(data.payload); }
    }else{
      closeParentPopup();
      setLocked(data.message||'PIN falsch.');
    }
  }else if(data.kind==='status'){
    if(unlocked){
      if(data.expires)expiresAt=data.expires*1000;
      const pl=data.payload||{}; render(pl);
      if(parentPopup&&!parentPopup.closed) renderParentPopup(pl);
    }
  }else if(data.kind==='locked'){
    closeParentPopup(); setLocked(data.message||'Gesperrt.');
  }
}

document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>digit(b.dataset.digit||'')));
document.getElementById('backspace').addEventListener('click',clearPin);
document.getElementById('pinOk').addEventListener('click',submitPin);
document.getElementById('refreshBtn').addEventListener('click',refresh);
document.getElementById('tileScrollUp').addEventListener('click',()=>embeddedScrollBy(-1));
document.getElementById('tileScrollDown').addEventListener('click',()=>embeddedScrollBy(1));
document.getElementById('popupBtn').addEventListener('click',openParentPopupNow);
document.getElementById('lockBtn').addEventListener('click',lockNow);
window.addEventListener('resize',updateLayout);
if(window.ResizeObserver){ new ResizeObserver(updateLayout).observe(document.getElementById('app')); }
document.getElementById('popupBtn').style.display=popupEnabled?'inline-block':'none';
updateLayout();
setTimeout(()=>send('hello'),100);
