<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button,select{font:inherit}button{border:0;border-radius:10px;min-height:40px;padding:8px 11px;cursor:pointer;background:rgba(127,127,127,.18);color:inherit}button:disabled{opacity:.4;cursor:not-allowed}.danger{background:#d99a9a}.ok{background:#9bcdb8}.ticket{background:#aaa0d6}.primary{background:#1473e6;color:white}.card{background:rgba(127,127,127,.09);border:1px solid rgba(127,127,127,.22);border-radius:13px;padding:10px;min-width:0}.sub{font-size:11px;opacity:.7}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#888}.dot.on{background:#2aa666}.dot.off{background:#d64b4b}.dot.err{background:#d89422}
#app{width:100%;height:100%;padding:42px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}#locked{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.lockCard{width:min(320px,94%);display:flex;flex-direction:column;align-items:center;gap:8px}.lockTitle{font-weight:800;font-size:22px}.dots{font-size:24px;letter-spacing:6px;min-height:28px}.keypad{width:min(230px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.keypad button{height:48px;font-size:18px;padding:0}#lockmsg{min-height:18px;font-size:11px;opacity:.75;text-align:center}
#unlocked{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar .grow{flex:1}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(127,127,127,.16)}.badge.warn{background:#b66c00;color:white}#msg{font-size:11px;min-height:16px;text-align:center;opacity:.8}.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.overviewCard{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center}.overviewCard strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.overviewRest{font-size:20px;font-weight:800}.overviewSmall{font-size:10px;opacity:.72}.ticketPanel{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ticketCode{font-variant-numeric:tabular-nums;letter-spacing:1px;padding:4px 7px;border-radius:7px;background:rgba(127,127,127,.15);font-size:12px}.ticketCode.used{opacity:.45;text-decoration:line-through}.groups{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}.groupHead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}.groupHead strong{font-size:17px;flex:1 1 120px}.budget{font-size:11px;padding:5px 8px;border-radius:8px;background:rgba(127,127,127,.13)}select{border:1px solid rgba(127,127,127,.28);border-radius:8px;padding:7px 8px;background:rgba(127,127,127,.10);color:inherit;max-width:210px;min-width:140px}.device{display:grid;grid-template-columns:minmax(170px,1.6fr) minmax(120px,.8fr) minmax(120px,.8fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid rgba(127,127,127,.15)}.devname{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}.ip,.timeinfo{font-size:10px;opacity:.7}.state{font-size:11px}.ticketState{font-size:10px;line-height:1.3}.actions{display:grid;grid-template-columns:repeat(3,auto);gap:5px}.actions button{min-height:36px;font-size:11px;padding:6px 8px}
@media(max-width:820px){#app{padding:40px 7px 7px}.device{grid-template-columns:minmax(145px,1fr) minmax(105px,.7fr) auto}.ticketState{grid-column:1/3}.actions{grid-column:3;grid-row:1/3;grid-template-columns:1fr}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.groupHead strong{flex-basis:100%}}
@media(max-width:480px){.overview{grid-template-columns:1fr}.device{grid-template-columns:1fr auto}.state,.ticketState{grid-column:1}.actions{grid-column:2;grid-row:1/4}.groupHead select{width:100%;max-width:none}.toolbar .badge{font-size:9px}}
</style>
</head>
<body>
<div id="app">
 <div id="locked"><div class="card lockCard"><div class="lockTitle">Eltern-PIN</div><div class="sub">Gleiche PIN wie FRITZ!Box Kindersicherung</div><div id="dots" class="dots">••••</div><div class="keypad"><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button id="back">⌫</button><button data-digit="0">0</button><button id="ok" class="primary">OK</button></div><div id="lockmsg"></div></div></div>
 <div id="unlocked">
  <div class="toolbar"><div class="grow"></div><span id="mode" class="badge"></span><button id="refresh">↻ Aktualisieren</button><button id="lock">🔒 Sperren</button></div>
  <div id="msg"></div><div id="overview" class="overview"></div><div id="tickets" class="card ticketPanel"></div><div id="groups" class="groups"></div>
 </div>
</div>
<script>
let pin='',unlocked=false,expiresAt=0,lastData=null,lockTimer=null;const clientId=getClientId();
function getClientId(){let id=sessionStorage.getItem('fkseClientId');if(!id){id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);sessionStorage.setItem('fkseClientId',id)}return id}
function send(op,extra={}){requestAction('command',JSON.stringify(Object.assign({op,clientId},extra)))}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fmt(sec){sec=Math.max(0,Number(sec)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h} h ${m} min`:`${m} min`}
function paint(){document.getElementById('dots').textContent=pin.length?'•'.repeat(pin.length):'••••'}function setLocked(m=''){unlocked=false;expiresAt=0;lastData=null;document.getElementById('locked').style.display='flex';document.getElementById('unlocked').style.display='none';document.getElementById('lockmsg').textContent=m;if(lockTimer)clearInterval(lockTimer)}function setUnlocked(d){unlocked=true;expiresAt=(d.expires||0)*1000;document.getElementById('locked').style.display='none';document.getElementById('unlocked').style.display='flex';if(lockTimer)clearInterval(lockTimer);lockTimer=setInterval(()=>{if(expiresAt&&Date.now()>expiresAt)setLocked('Automatisch gesperrt.')},1000)}
function statusFor(d){if(d.error)return{cls:'err',text:'Fehler'};if(d.wan==='granted')return{cls:'on',text:'Zugang aktiv'};if(d.wan==='denied')return{cls:'off',text:'Gesperrt'};return{cls:'err',text:'Unbekannt'}}
function summaries(data){const by={};(data.devices||[]).forEach(d=>{const g=d.group||'Geräte';(by[g]??=[]).push(d)});return Object.entries(by).map(([group,devs])=>{const valid=devs.filter(d=>!d.error),online=valid.filter(d=>d.wan==='granted').length,shared=valid.filter(d=>Boolean(d.isTimeShared)&&Number(d.timeMax)>0);let rest=null,profile='';if(shared.length){const ids=[...new Set(shared.map(d=>d.profileId||d.profile||''))];if(ids.length===1){rest=Math.max(0,Number(shared[0].timeMax)-Number(shared[0].timeUsed));profile=shared[0].profile||''}}if(rest===null){const timed=valid.filter(d=>Number(d.timeMax)>0);if(timed.length===1){rest=Math.max(0,Number(timed[0].timeMax)-Number(timed[0].timeUsed));profile=timed[0].profile||''}}const ticketCount=valid.reduce((n,d)=>n+(Number(d.ticketsInAdvance)||0),0);return{group,devs,online,total:devs.length,rest,profile,ticketCount}})}
function profileSelect(data,current,onChange,placeholder){const s=document.createElement('select');s.disabled=data.readOnly;const p=document.createElement('option');p.value='';p.textContent=placeholder;s.appendChild(p);(data.profiles||[]).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;if(x.id===current)o.selected=true;s.appendChild(o)});s.addEventListener('change',()=>{if(s.value)onChange(s.value)});return s}
function render(data){if(!unlocked)return;lastData=data;const mode=document.getElementById('mode');mode.textContent=data.readOnly?'TEST · nur lesen':'STEUERUNG AKTIV';mode.className='badge'+(data.readOnly?' warn':'');document.getElementById('msg').textContent=data.message||'';const ss=summaries(data);const ov=document.getElementById('overview');ov.innerHTML='';ss.forEach(x=>{const c=document.createElement('div');c.className='card overviewCard';c.innerHTML=`<strong>${esc(x.group)}</strong><div class="overviewRest">${x.rest===null?'—':esc(fmt(x.rest))}</div><div class="overviewSmall">${esc(x.profile||'mehrere/kein Profil')}</div><div class="overviewSmall">${x.online}/${x.total} aktiv · Tickets ${x.ticketCount}</div>`;ov.appendChild(c)});
 const tp=document.getElementById('tickets');tp.innerHTML='<strong>Ticketcodes</strong>';const codes=data.issuedTickets||[];if(codes.length)codes.forEach(t=>{const s=document.createElement('span');s.className='ticketCode'+(t.status==='marked'?'':' used');s.textContent=t.id+(t.status==='marked'?'':' · benutzt/ungültig');tp.appendChild(s)});else{const s=document.createElement('span');s.className='sub';s.textContent='Noch kein Ticketcode über Symcon erzeugt.';tp.appendChild(s)}const tb=document.createElement('button');tb.className='ticket';tb.textContent='Ticketcode holen';tb.disabled=data.readOnly;tb.addEventListener('click',()=>send('mark_ticket'));tp.appendChild(tb);
 const by={};(data.devices||[]).forEach(d=>{const g=d.group||'Geräte';(by[g]??=[]).push(d)});const root=document.getElementById('groups');root.innerHTML='';Object.entries(by).forEach(([g,devs])=>{const sum=ss.find(x=>x.group===g);const c=document.createElement('div');c.className='card';const head=document.createElement('div');head.className='groupHead';const n=document.createElement('strong');n.textContent=g;head.appendChild(n);const b=document.createElement('span');b.className='budget';b.textContent=sum&&sum.rest!==null?'Rest '+fmt(sum.rest):'Budget —';head.appendChild(b);if((data.profiles||[]).length)head.appendChild(profileSelect(data,'',v=>send('group_profile',{group:g,profileId:v}),'Profil für alle …'));const sp=document.createElement('button');sp.className='danger';sp.textContent='Alle sperren';sp.disabled=data.readOnly;sp.addEventListener('click',()=>send('group_disallow',{group:g,disallow:true}));const fr=document.createElement('button');fr.className='ok';fr.textContent='Alle freigeben';fr.disabled=data.readOnly;fr.addEventListener('click',()=>send('group_disallow',{group:g,disallow:false}));head.appendChild(sp);head.appendChild(fr);c.appendChild(head);
  devs.forEach(d=>{const row=document.createElement('div');row.className='device';const info=document.createElement('div');const dn=document.createElement('div');dn.className='devname';dn.textContent=d.name||'Gerät';info.appendChild(dn);const meta=document.createElement('div');meta.className='meta';const ip=document.createElement('span');ip.className='ip';ip.textContent=d.ip||'';meta.appendChild(ip);if((data.profiles||[]).length)meta.appendChild(profileSelect(data,d.profileId||'',v=>send('set_profile',{ip:d.ip,profileId:v}),d.profile||'Profil wählen'));if(Number(d.timeMax)>0&&!d.isTimeShared){const t=document.createElement('span');t.className='timeinfo';t.textContent='Rest '+fmt(Math.max(0,Number(d.timeMax)-Number(d.timeUsed)));meta.appendChild(t)}info.appendChild(meta);row.appendChild(info);const st=statusFor(d);const state=document.createElement('div');state.className='state';state.innerHTML=`<span class="dot ${st.cls}"></span>${esc(st.text)}`;row.appendChild(state);const ts=document.createElement('div');ts.className='ticketState';const ti=Number(d.ticketsInAdvance)||0,tv=Number(d.ticketValid)||0;ts.innerHTML=`<div>Zusatz-Tickets: <strong>${ti}</strong></div><div class="sub">${tv?tv+' min Ticketzeit aktiv':(Number(d.timeMax)>0?'bereit für +45 min':'kein Zeitbudget')}</div>`;row.appendChild(ts);const a=document.createElement('div');a.className='actions';const add=document.createElement('button');add.className='ticket';add.textContent='+45 min';add.disabled=data.readOnly||Number(d.timeMax)<=0||d.disallow===true;add.addEventListener('click',()=>send('add_ticket_time',{ip:d.ip}));const s=document.createElement('button');s.className='danger';s.textContent='Sperren';s.disabled=data.readOnly;s.addEventListener('click',()=>send('set_disallow',{ip:d.ip,disallow:true}));const f=document.createElement('button');f.className='ok';f.textContent='Freigeben';f.disabled=data.readOnly;f.addEventListener('click',()=>send('set_disallow',{ip:d.ip,disallow:false}));a.appendChild(add);a.appendChild(s);a.appendChild(f);row.appendChild(a);c.appendChild(row)});root.appendChild(c)});if(!Object.keys(by).length)root.innerHTML='<div class="card sub">Noch keine Geräte konfiguriert.</div>'}
function handle(data){if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){return}}if(!data||(data.target&&data.target!=='*'&&data.target!==clientId))return;if(data.kind==='auth'){if(data.ok){setUnlocked(data);if(data.payload)render(data.payload)}else setLocked(data.message||'PIN falsch.')}else if(data.kind==='status'){if(unlocked){if(data.expires)expiresAt=data.expires*1000;render(data.payload||{})}}else if(data.kind==='locked')setLocked(data.message||'Gesperrt.')}
document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>{if(pin.length<8)pin+=b.dataset.digit||'';paint()}));document.getElementById('back').addEventListener('click',()=>{pin=pin.slice(0,-1);paint()});document.getElementById('ok').addEventListener('click',()=>{if(pin.length<4){document.getElementById('lockmsg').textContent='Mindestens 4 Ziffern.';return}send('unlock',{pin});pin='';paint()});document.getElementById('refresh').addEventListener('click',()=>send('refresh'));document.getElementById('lock').addEventListener('click',()=>{send('lock');setLocked('Gesperrt.')});setTimeout(()=>send('hello'),100);
</script>
</body>
</html>
